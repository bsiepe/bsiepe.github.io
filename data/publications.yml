- id: pena-loray-sample-size-institutional-effects
  type: preprint
  title: "Beyond Rules of Thumb: Empirical Sample Size Requirements for Detecting Institutional Effects in the Context of Therapist Effects"
  authors:
    - { family: Pena Loray, given: Juan Segundo }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Hehlmann, given: Miriam Ina }
    - { family: Deisenhofer, given: Anne-Katharina }
    - { family: Wester, given: Robin Anno }
    - { family: Rubel, given: Julian }
  venue: PsyArXiv
  year: 2026
  status: preprint
  preprint_doi: "10.31234/osf.io/gswc9_v1"
  links:
    code: "https://osf.io/gtf2z"
    prereg: "https://osf.io/gtf2z"
  areas: [ simulation ]
  abstract: "Objective: Multilevel modelling of therapist effects (TE) and institutional effects (IE) is standard in psychotherapy research, yet empirical sample-size guidance is scarce for TE and virtually absent for IE. Existing recommendations rely on rules of thumb from two-level designs that vary widely across sources and do not extend to three-level structures. We aimed to provide empirically derived design recommendations for reliably detecting TE and IE in three-level psychotherapy studies. Methods: We conducted a fully factorial Monte Carlo simulation crossing six design factors: true TE, true IE, patient allocation (balanced vs. unbalanced), patients per therapist, therapists per institution, and number of institutions. This yielded 52,488 unique conditions, each with 1,000 replications. For every condition we fitted a three-level random-intercept model and derived parametric bootstrap 95% confidence intervals for both intraclass correlations, evaluating bias, RMSE, coverage, and statistical power at three pre-registered thresholds. Results: Detecting TE was feasible across a wide range of realistic designs, requiring as few as 10 to 40 total therapists for moderate effects (TE ≥ 0.05). Detecting IE, in contrast, was strongly constrained by the number of institutions: no design with fewer than four institutions reached 80% power at the primary threshold, and adequate detection of small to moderate IE (≤ 0.20) required at least five institutions with substantial within-institution sampling. Conclusion: Reliably detecting IE imposes qualitatively different design requirements than TE, particularly regarding the minimum number of institutions. We provide cutoff tables and a Shiny application to support empirically informed sample-size decisions."

- id: siepe-dynamic-network-features-treatment-selection
  type: article
  title: "Using features of dynamic networks to guide treatment selection and outcome prediction: The central role of uncertainty"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Kloft, given: Matthias }
    - { family: Zhang, given: Yong }
    - { family: Petersen, given: Fridtjof }
    - { family: Bringmann, given: Laura F. }
    - { family: Heck, given: Daniel W. }
  venue: Psychological Methods
  year: 2026
  status: advance-online
  doi: "10.1037/met0000872"
  preprint_doi: "10.31234/osf.io/2c8xf_v2"
  links:
    code: "https://osf.io/njvgc/"
    data: "https://osf.io/njvgc/"
    prereg: "https://osf.io/a96dt/overview"
  areas: [ timeseries, networks, bayesian, simulation ]
  selected: true
  abstract: Multivariate time series models are commonly used in psychology to investigate person-specific associations between multiple variables. They are often represented and interpreted as dynamic network models, where features such as the centrality of nodes can potentially guide treatment selection and outcome prediction. Researchers typically rely on point estimates of specific network features while ignoring estimation uncertainty, which can lead to wrong inferences and over-optimistic claims. We introduce a one-step Bayesian approach for estimating multilevel vector autoregressive models (BmlVAR), which enables uncertainty quantification for person-specific network features and the regression of external outcomes on such features. In a preregistered simulation study, we compare the new model with several popular methods for network estimation. We also apply all methods to empirical data to highlight their differences. Our simulation results indicate that all methods perform mediocrely in estimating different centrality measures in practically relevant settings. BmlVAR still outperforms the other methods in many simulation conditions, especially regarding the statistical power to detect associations with an outcome. However, estimating the model properly can be challenging with limited data. Overall, all methods require a lot of data or very large effects to produce reasonably accurate results. Thus, although centrality measures based on dynamic networks have been widely used, our simulation study suggests they are unlikely to work well for achieving major goals of interest, such as guiding treatment selection and outcome prediction. We provide a new model that incorporates estimation uncertainty into the modelling process, thereby protecting against premature conclusions.

- id: vogelsmeier-careless-responding-ema
  type: article
  title: "Identifying careless responding in ecological momentary assessment: Inconsistent signals from different detection methods in the WARN-D data"
  authors:
    - { family: Vogelsmeier, given: Leonie V. D. E. }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Ulitzsch, given: Esther }
    - { family: Eisele, given: Gudrun }
    - { family: Geeraerts, given: Joran }
    - { family: Klocek, given: Adam }
    - { family: Proppert, given: Ricarda K. K. }
    - { family: Rieble, given: Carlotta L. }
    - { family: Tutunji, given: Rayyan }
    - { family: Dejonckheere, given: Egon }
    - { family: Kuppens, given: Peter }
    - { family: Fried, given: Eiko I. }
  venue: Psychological Methods
  year: 2026
  status: advance-online
  doi: "10.1037/met0000845"
  preprint_doi: "10.31234/osf.io/4dfbz_v1"
  links:
    code: "https://osf.io/rqgdf"
  areas: [ esm ]
  abstract: Collecting intensive longitudinal data via methods like ecological momentary assessment (EMA) is necessary to study dynamics in psychological constructs. However, detecting careless responding is more important than ever, as this methodology burdens participants more than traditional single survey studies. If undetected, careless responding reduces data quality and can lead to invalid findings by distorting correlations between items and constructs and compromising the psychometric properties of scales. In turn, this hinders progress toward cumulative psychological science. In recent years, several data-driven approaches have been proposed that assess whether an individual was attentive or careless for each timepoint-specific measurement after data collection. However, the variety and complexity of available methods can be overwhelming for researchers. In this paper, we summarized, applied, and compared 13 methods that flag careless responses in a rich EMA dataset from the WARN-D study with 206,318 observations (from n = 1194 participants). Together with our detailed supplementary tutorials, the paper serves as a guide for researchers to evaluate and report careless responding in their own data. At the same time, we show that the development of methods for careless responding detection is still in its early stages, as the studied approaches produced very different results. We provide recommendations for which methods are currently most promising based on our findings and discuss important next steps in validating them empirically.

- id: siepe-openesm
  type: article
  title: "Introducing openESM: A database of openly available experience sampling datasets"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Haslbeck, given: Jonas M. B. }
    - { family: Kloft, given: Matthias }
    - { family: Büchner, given: Anabel }
    - { family: Zhang, given: Yong }
    - { family: Fried, given: Eiko I. }
    - { family: Heck, given: Daniel W. }
  venue: Behavior Research Methods
  volume: "58"
  issue: "8"
  article_number: "240"
  year: 2026
  status: published
  doi: "10.3758/s13428-026-03112-y"
  preprint_doi: "10.31234/osf.io/qfdtb_v2"
  links:
    code: "https://github.com/openesm-project/"
    website: "https://openesmdata.org"
  areas: [ esm, open-science ]
  selected: true
  abstract: "Experience sampling via mobile devices enables unprecedented insights into daily life. However, individual studies often cannot answer research questions conclusively, and open data are scattered across repositories in different formats. This impedes research into robustness, generalizability, and heterogeneity. We address this issue by introducing, an open-source database of openly available experience sampling datasets in a harmonized format. The growing database currently comprises 60 datasets with more than 16,000 participants and more than 740,000 observations. Metadata can be searched via our website ( openesmdata.org ) to select and download datasets via packages in R and Python. We demonstrate the potential of through an analysis of within-person correlations of positive and negative affect in 39 datasets, providing evidence for a large negative momentary correlation ( $$-0.49$$ - 0.49, 95% CI: [ $$-0.54$$ - 0.54, $$-0.42$$ - 0.42 ]). We end by discussing the design principles that will allow to become a continuously evolving community resource for cumulative experience sampling research."

- id: haslbeck-model-checking-var
  type: article
  title: "Model Checking for Vector Autoregressive Models"
  authors:
    - { family: Haslbeck, given: Jonas }
    - { family: Jongerling, given: Joran }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Epskamp, given: Sacha }
    - { family: Waldorp, given: Lourens }
  venue: Psychological Methods
  year: 2026
  status: advance-online
  doi: "10.1037/met0000855"
  preprint_doi: "10.31234/osf.io/k6uz4_v2"
  links:
    code: "https://github.com/jmbh/ModelCheckingForVAR"
    data: "https://github.com/jmbh/ModelCheckingForVAR"
  areas: [ timeseries ]
  abstract: Time series have become pervasive in psychological research and Vector Autoregressive (VAR) models have become one of the most popular classes of models to study within-person dynamics in such data. However, systematic checking of how well a VAR model fits the data is hardly ever performed. This is a problem, because model misfit can lead both to incorrect interpretations of model parameters and to missing effects in the data that would be theoretically interesting. We provide a tutorial that explains the theory behind model checking, introduces the most common types of VAR model misspecification in the context of psychological time series, and introduces diagnostics for them, using plots and simulations. We then apply these tools to assess model fit for a multilevel VAR model estimated on a typical empirical dataset of emotion measurements over three weeks of 179 persons. We conclude by discussing three complementary areas of research that could improve the modeling of psychological time series in the future.

- id: siepe-preregister-simulation-study
  type: preprint
  title: "Why, when, and how to (or not to) preregister a simulation study"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Bartoš, given: František }
    - { family: Boulesteix, given: Anne-Laure }
    - { family: Heck, given: Daniel W. }
    - { family: Peikert, given: Aaron }
    - { family: Sarafoglou, given: Alexandra }
    - { family: Pawel, given: Samuel }
  venue: PsyArXiv
  year: 2026
  status: preprint
  preprint_doi: "10.31234/osf.io/cxjrb_v1"
  areas: [ simulation, open-science, metascience ]
  abstract: Simulation studies play a central role in methodological research by providing evidence about the empirical performance of statistical methods. At the same time, they involve substantial researcher degrees of freedom in the choice of data-generating mechanisms, methods, performance measures, and reporting decisions, which can undermine the credibility of their results. Preregistration has been proposed as a tool to increase transparency and reduce such flexibility, yet its role in simulation studies remains contested. In this paper, we discuss why researchers should or should not preregister their simulation studies, elaborating on the theoretical and pragmatic benefits as well as disadvantages of preregistration. Drawing on philosophical accounts, we argue that preregistration primarily reduces epistemic uncertainty about which simulation conditions were considered and why, which enables honest evaluation of whether results support the conclusions drawn. We argue that the resulting benefits depend critically on the aims of a study and its position within the methodological research cycle. Late-phase studies that investigate mature methods tend to benefit more, while early-phase studies investigating newly proposed methods generally benefit less from preregistration. We further discuss practical challenges specific to simulation studies, including the timing of preregistration, the role of preliminary simulations, and safeguards against post hoc registration. Finally, we outline concrete guidance on how to preregister simulation studies and discuss Registered Reports as a particularly promising format. Overall, we argue for a nuanced, purpose-driven use of preregistration that supports rather than hinders methodological progress.

- id: huth-social-connection-loneliness
  type: preprint
  title: "Social connection features predicting loneliness: A longitudinal, interpretable machine-learning analysis"
  authors:
    - { family: Huth, given: Karoline }
    - { family: Wijnen, given: Senne Maria Catharina Elisabeth }
    - { family: Skjerdingstad, given: Nora }
    - { family: Bartoš, given: František }
    - { family: Finnemann, given: Adam }
    - { family: Ebrahimi, given: Omid V. }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Steijvers, given: Lisanne Catharina Johanna }
    - { family: van Bilsen, given: Céline }
    - { family: Bosma, given: Hans }
    - { family: Schumacher, given: Lea }
    - { family: Dukers-Muijrers, given: Nicole }
  venue: PsyArXiv
  year: 2026
  status: preprint
  preprint_doi: "10.31234/osf.io/mt76k_v1"
  links:
    code: "https://osf.io/5hmcd"
    data: { url: "https://osf.io/5hmcd", note: synthetic data }
  abstract: "Background: Loneliness is increasingly recognized as a major global health concern. As a marker of poor social health, loneliness may emerge when certain aspects of social connection are missing. Yet, it remains unclear to what extent and which features of social connection contribute to a vulnerability of loneliness. In this study, we examined how 24 features of individuals’ social connections spanning structural, functional and quality dimensions predict loneliness both at the same time point and over a two-year follow-up. Methods: Using fine-grained, tie-specific data from a population-based Dutch cohort aged 18–93 years at baseline (N = 6,852) and at follow-up (N = 3,175), we evaluated which social connection features are predictive of loneliness using random-forest models at both timepoints and across age groups. Findings: Across both analyses, network quality was the strongest predictor of loneliness. Good-quality and strained relationships, friends-know-family, and network size consistently predicted loneliness. Being in a steady relationship was a top predictor at baseline but less important at follow-up. Functional aspects were generally less predictive. Models explained 24% of baseline and 44% of follow-up variance.Interpretation: These findings suggest that loneliness is most strongly linked to the quality of one’s social ties rather than their function, and that individuals embedded in low-quality or strained networks are particularly vulnerable. The results also underscore that loneliness is shaped by a broader constellation of factors beyond social connections."

- id: bartos-living-synthetic-benchmarks
  type: preprint
  title: "Living synthetic benchmarks: A neutral and cumulative framework for simulation studies"
  authors:
    - { family: Bartoš, given: František }
    - { family: Pawel, given: Samuel }
    - { family: Siepe, given: Björn S., me: true }
  venue: arXiv
  year: 2025
  status: preprint
  preprint_doi: "10.48550/arXiv.2510.19489"
  links:
    code: "https://github.com/FBartos/PublicationBiasBenchmark"
    data: "https://github.com/FBartos/PublicationBiasBenchmark"
  areas: [ simulation, metascience ]
  abstract: Simulation studies are widely used to evaluate statistical methods. However, new methods are often introduced and evaluated using data-generating mechanisms (DGMs) devised by the same authors. This coupling creates misaligned incentives, e.g., the need to demonstrate the superiority of new methods, potentially compromising the neutrality of simulation studies. Furthermore, results of simulation studies are often difficult to compare due to differences in DGMs, competing methods, and performance measures. This fragmentation can lead to conflicting conclusions, hinder methodological progress, and delay the adoption of effective methods. To address these challenges, we introduce the concept of living synthetic benchmarks. The key idea is to disentangle method and simulation study development and continuously update the benchmark whenever a new DGM, method, or performance measure becomes available. This separation benefits the neutrality of method evaluation, emphasizes the development of both methods and DGMs, and enables systematic comparisons. In this paper, we outline a blueprint for building and maintaining such benchmarks, discuss the technical and organizational challenges of implementation, and demonstrate feasibility with a prototype benchmark for publication bias adjustment methods. We conclude that living synthetic benchmarks have the potential to foster neutral, reproducible, and cumulative evaluation of methods, benefiting both method developers and users.

