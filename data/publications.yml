- id: siepe-simulation-studies-template
  type: article
  title: "Simulation Studies for Methodological Research in Psychology: A Standardized Template for Planning, Preregistration, and Reporting"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Bartoš, given: František }
    - { family: Morris, given: Tim P. }
    - { family: Boulesteix, given: Anne-Laure }
    - { family: Heck, given: Daniel W. }
    - { family: Pawel, given: Samuel }
  venue: Psychological Methods
  year: 2024
  status: advance-online
  doi: "10.1037/met0000695"
  preprint_doi: "10.31234/osf.io/ufgy6"
  links:
    code: "https://github.com/bsiepe/SimPsychReview"
    data: "https://github.com/bsiepe/SimPsychReview"
    prereg: "https://osf.io/dfgvu/registrations"
  areas: [ simulation, open-science, metascience ]
  selected: true
  abstract: Simulation studies are widely used for evaluating the performance of statistical methods in psychology. However, the quality of simulation studies can vary widely in terms of their design, execution, and reporting. In order to assess the quality of typical simulation studies in psychology, we reviewed 321 articles published in Psychological Methods, Behavioral Research Methods, and Multivariate Behavioral Research in 2021 and 2022, among which 100/321 = 31.2% report a simulation study. We find that many articles do not provide complete and transparent information about key aspects of the study, such as justifications for the number of simulation repetitions, Monte Carlo uncertainty estimates, or code and data to reproduce the simulation studies. To address this problem, we provide a summary of the ADEMP (Aims, Data-generating mechanism, Estimands and other targets, Methods, Performance measures) design and reporting framework from Morris, White, and Crowther (2019) adapted to simulation studies in psychology. Based on this framework, we provide ADEMP-PreReg, a step-by-step template for researchers to use when designing, potentially preregistering, and reporting their simulation studies. We give formulae for estimating common performance measures, their Monte Carlo standard errors, and for calculating the number of simulation repetitions to achieve a desired Monte Carlo standard error. Finally, we give a detailed tutorial on how to apply the ADEMP framework in practice using an example simulation study on the evaluation of methods for the analysis of pre–post measurement experiments.

- id: siepe-bayesian-idiographic-networks
  type: article
  title: "Bayesian Estimation and Comparison of Idiographic Network Models"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Kloft, given: Matthias }
    - { family: Heck, given: Daniel W. }
  venue: Psychological Methods
  year: 2024
  status: advance-online
  doi: "10.1037/met0000672"
  preprint_doi: "10.31234/osf.io/uwfjc"
  links:
    code: "https://github.com/bsiepe/var-compare"
    data: "https://github.com/bsiepe/var-compare"
    supplement: "https://osf.io/9byaj/"
  areas: [ timeseries, networks, bayesian ]
  abstract: >-
    Idiographic network models are estimated on time-series data of a single individual and allow researchers to investigate person-specific associations between multiple variables over time. The most common approach for fitting graphical vector autoregressive (GVAR) models uses LASSO regularization to estimate a contemporaneous and a temporal network. However, estimation of idiographic networks can be unstable in relatively small data sets typical for psychological research. This bears the risk of misinterpreting differences in estimated networks as spurious heterogeneity between individuals. As a remedy, we evaluate the performance of a Bayesian alternative for fitting GVAR models that allows for regularization of parameters while accounting for estimation uncertainty. We also develop a novel test, implemented in the tsnet package in R, which assesses whether differences between estimated networks are reliable based on matrix norms. We first compare Bayesian and LASSO approaches across a range of conditions in a simulation study. Overall, LASSO estimation performs well, while a Bayesian GVAR without edge selection may perform better when the true network is dense. In an additional simulation study, the novel test is conservative and shows good false-positive rates. Finally, we apply Bayesian estimation and testing in an empirical example using daily data on clinical symptoms for 40 individuals. We additionally provide functionality to estimate Bayesian GVAR models in Stan within tsnet.Overall, Bayesian GVAR modelling facilitates the assessment of estimation uncertainty which is important for studying inter-individual differences of intra-individual dynamics. In doing so, the novel test serves as a safeguard against premature conclusions of heterogeneity.
  summary: >-
    Idiographic networks are popular, but they contain a lot of uncertainty. Even when based on same true model, resulting networks may "look different", creating a false sense of heterogeneity. In this paper, we evaluate an existing Bayesian method to estimate idiographic networks. Then, we propose a novel test that evaluates the evidence that differences in edges between two models are not just due to sampling variability. We then apply estimation & test methods to empirical data and introduce the R Package `tsnet` that includes the proposed method.

- id: siepe-time-varying-networks-depression
  type: article
  title: "Time-Varying Network Models for the Temporal Dynamics of Depressive Symptomatology in Patients With Depressive Disorders: Secondary Analysis of Longitudinal Observational Data"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Sander, given: Christian }
    - { family: Schultze, given: Martin }
    - { family: Kliem, given: Andreas }
    - { family: Ludwig, given: Sascha }
    - { family: Hegerl, given: Ulrich }
    - { family: Reich, given: Hanna }
  venue: JMIR Mental Health
  volume: "11"
  article_number: "e50136"
  year: 2024
  status: published
  doi: "10.2196/50136"
  links:
    code: "https://github.com/bsiepe/steady_tvvar"
    prereg: "https://osf.io/mnehzs"
  areas: [ timeseries, networks ]
  abstract: "**Background:** As depression is highly heterogenous, an increasing number of studies investigate person-specific associations of depressive symptoms in longitudinal data. However, most studies in this area of research conceptualize symptom interrelations to be static and time invariant, which may lead to important temporal features of the disorder being missed. **Objective:** To reveal the dynamic nature of depression, we aimed to use a recently developed technique to investigate whether and how associations among depressive symptoms change over time. **Methods:** Using daily data (mean length 274, SD 82 d) of 20 participants with depression, we modeled idiographic associations among depressive symptoms, rumination, sleep, and quantity and quality of social contacts as dynamic networks using time-varying vector autoregressive models. **Results:** The resulting models showed marked interindividual and intraindividual differences. For some participants, associations among variables changed in the span of some weeks, whereas they stayed stable over months for others. Our results further indicated nonstationarity in all participants. **Conclusions:** Idiographic symptom networks can provide insights into the temporal course of mental disorders and open new avenues of research for the study of the development and stability of psychopathological processes."

- id: westhoff-psychological-flexibility-daily-lives
  type: article
  title: "Psychological flexibility and cognitive-affective processes in young adults' daily lives"
  authors:
    - { family: Westhoff, given: Marlon }
    - { family: Heshmati, given: Saida }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Vogelbacher, given: Christoph }
    - { family: Ciarrochi, given: Joseph }
    - { family: Hayes, given: Steven C. }
    - { family: Hofmann, given: Stefan G. }
  venue: Scientific Reports
  volume: "14"
  issue: "1"
  article_number: "8182"
  year: 2024
  status: published
  doi: "10.1038/s41598-024-58598-3"
  links:
    code: "https://osf.io/ejtzs/"
    data: "https://osf.io/ejtzs/"
  areas: [ timeseries, esm, networks ]
  abstract: "Psychological flexibility plays a crucial role in how young adults adapt to their evolving cognitive and emotional landscapes. Our study investigated a core aspect of psychological flexibility in young adults: adaptive variability and maladaptive rigidity in the capacity for behavior change. We examined the interplay of these elements with cognitive-affective processes within a dynamic network, uncovering their manifestation in everyday life. Through an Ecological Momentary Assessment design, we collected intensive longitudinal data over 3 weeks from 114 young adults ages 19 to 32. Using a dynamic network approach, we assessed the temporal dynamics and individual variability in flexibility in relation to cognitive-affective processes in this sample. Rigidity exhibited the strongest directed association with other variables in the temporal network as well as highest strength centrality, demonstrating particularly strong associations to other variables in the contemporaneous network. In conclusion, the results of this study suggest that rigidity in young adults is associated with negative affect and cognitions at the same time point and the immediate future."

- id: langener-preregistering-passive-smartphone
  type: article
  title: "A Template and Tutorial for Preregistering Studies Using Passive Smartphone Measures"
  authors:
    - { family: Langener, given: Anna M. }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Elsherif, given: Mahmoud }
    - { family: Niemeijer, given: Koen }
    - { family: Andresen, given: Pia K. }
    - { family: Akre, given: Samir }
    - { family: Bringmann, given: Laura F. }
    - { family: Cohen, given: Zachary D. }
    - { family: Choukas, given: Nathaniel R. }
    - { family: Drexl, given: Konstantin }
    - { family: Fassi, given: Luisa }
    - { family: Green, given: James }
    - { family: Hoffmann, given: Tabea }
    - { family: Jagesar, given: Raj R. }
    - { family: Kas, given: Martien J. H. }
    - { family: Kurten, given: Sebastian }
    - { family: Schoedel, given: Ramona }
    - { family: Stulp, given: Gert }
    - { family: Turner, given: Georgia }
    - { family: Jacobson, given: Nicholas C. }
  venue: Behavior Research Methods
  volume: "56"
  issue: "8"
  pages: "8289-8307"
  year: 2024
  status: published
  doi: "10.3758/s13428-024-02474-5"
  preprint_doi: "10.31234/osf.io/p4xf8"
  areas: [ esm, open-science ]
  abstract: Passive smartphone measures hold significant potential and are increasingly employed in psychological and biomedical research to capture an individual's behavior. These measures involve the near-continuous and unobtrusive collection of data from smartphones without requiring active input from participants. For example, GPS sensors are used to determine the (social) context of a person, and accelerometers to measure movement. However, utilizing passive smartphone measures presents methodological challenges during data collection and analysis. Researchers must make multiple decisions when working with such measures, which can result in different conclusions. Unfortunately, the transparency of these decision-making processes is often lacking. The implementation of open science practices is only beginning to emerge in digital phenotyping studies and varies widely across studies. Well-intentioned researchers may fail to report on some decisions due to the variety of choices that must be made. To address this issue and enhance reproducibility in digital phenotyping studies, we propose the adoption of preregistration as a way forward. Although there have been some attempts to preregister digital phenotyping studies, a template for registering such studies is currently missing. This could be problematic due to the high level of complexity that requires a well-structured template. Therefore, our objective was to develop a preregistration template that is easy to use and understandable for researchers. Additionally, we explain this template and provide resources to assist researchers in making informed decisions regarding data collection, cleaning, and analysis. Overall, we aim to make researchers' choices explicit, enhance transparency, and elevate the standards for studies utilizing passive smartphone measures.

- id: rimpler-fred
  type: article
  title: "Introducing FRED: Software for Generating Feedback Reports for Ecological Momentary Assessment Data"
  authors:
    - { family: Rimpler, given: Aljoscha }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Rieble, given: Carlotta L. }
    - { family: Proppert, given: Ricarda K. K. }
    - { family: Fried, given: Eiko I. }
  venue: Administration and Policy in Mental Health and Mental Health Services Research
  volume: "51"
  issue: "4"
  pages: "490-500"
  year: 2024
  status: published
  doi: "10.1007/s10488-023-01324-4"
  links:
    code: "https://osf.io/8q254/"
    app: "https://solo-fsw.shinyapps.io/FRED/"
  areas: [ esm ]
  abstract: Ecological Momentary Assessment (EMA) is a data collection approach utilizing smartphone applications or wearable devices to gather insights into daily life. EMA has advantages over traditional surveys, such as increasing ecological validity. However, especially prolonged data collection can burden participants by disrupting their everyday activities. Consequently, EMA studies can have comparably high rates of missing data and face problems of compliance. Giving participants access to their data via accessible feedback reports, as seen in citizen science initiatives, may increase participant motivation. Existing frameworks to generate such reports focus on single individuals in clinical settings and do not scale well to large datasets. Here, we introduce FRED (Feedback Reports on EMA Data) to tackle the challenge of providing personalized reports to many participants. FRED is an interactive online tool in which participants can explore their own personalized data reports. We showcase FRED using data from the WARN-D study, where 867 participants were queried for 85 consecutive days with four daily and one weekly survey, resulting in up to 352 observations per participant. FRED includes descriptive statistics, time-series visualizations, and network analyses on selected EMA variables. Participants can access the reports online as part of a Shiny app, developed via the R programming language. We make the code and infrastructure of FRED available in the hope that it will be useful for both research and clinical settings, given that it can be flexibly adapted to the needs of other projects with the goal of generating personalized data reports.

- id: talia-attachment-group-psychotherapy
  type: article
  title: "An exploratory study on how attachment classifications manifest in group psychotherapy"
  authors:
    # Complete list from Crossref (the website lists 7 of 11 without marking the gap).
    - { family: Talia, given: Alessandro }
    - { family: Georg, given: Anna }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Gullo, given: Salvatore }
    - { family: Miller-Bottome, given: Madeleine }
    - { family: Volkert, given: Jana }
    - { family: Neukel, given: Corinne }
    - { family: Kaess, given: Michael }
    - { family: Bempohl, given: Felix }
    - { family: Herpertz, given: Sabine C. }
    - { family: Taubner, given: Svenja }
  venue: "Research in Psychotherapy: Psychopathology, Process and Outcome"
  volume: "25"
  issue: "3"
  pages: "286-298"
  year: 2022
  status: published
  doi: "10.4081/ripppo.2022.653"
  abstract: "Recently, attachment-informed researchers and clinicians have begun to show that attachment theory offers a useful framework for exploring group psychotherapy. However, it remains unclear whether patients with differing attachment classifications would behave and speak in distinct ways in group therapy sessions. Aim: In this study, we conducted an exploratory analysis of the discourse of patients in group therapy who had independently received different classifications with gold standard interview measures of attachment in adults. Each patient participant attended one of three mentalization-based parenting groups. Before treatment, the Adult Attachment Interview (AAI) or the Parent Development Interview (PDI) were administered to each patient, and interviews were transcribed and coded to obtain the patient’s attachment classification. Groups included 2, 5, and 5 patients, respectively, and any session was led by at least two co-therapists. A total of 14 group sessions were transcribed verbatim. Sessions were analysed through a semi-inductive method, in order to identify markers that would typify patients of different attachment classifications in session. Through transcript excerpts and narrative descriptions, we report on the differing ways in which patients of different attachment classifications communicate in group psychotherapy, with the therapist and with each other. Our work provides useful information for group therapists and researchers regarding how differences in attachment status may play out in group sessions."

