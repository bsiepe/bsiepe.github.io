  status: published
  doi: "10.5964/meth.15665"
  preprint_doi: "10.31219/osf.io/etm3u"
  links:
    code: "https://github.com/bsiepe/network-multiverse"
    data: "https://github.com/bsiepe/network-multiverse"
    prereg: "https://osf.io/ahcx5"
    app: "https://bsiepe.shinyapps.io/shiny-app/"
  areas: [ timeseries, networks ]
  abstract: Specifying complex time series models typically allows for a wide range of plausible analysis strategies. However, researchers typically perform and report only a single, preferred analysis while ignoring alternatives that could yield different conclusions. As a remedy, we propose multiverse analysis to investigate the robustness of dynamic network analysis to arbitrary modeling choices. We focus on group iterative multiple model estimation (GIMME), a highly data-driven approach, and re-analyze two datasets (combined *n* = 199). We vary seven modeling parameters, resulting in 3,888 fitted models. Group-level and to a lesser extent subgroup-level results were mostly stable. Individual-level estimates were more heterogeneous, with some decisions strongly influencing results and conclusions. The robustness of GIMME to alternative modeling choices depends on the level of analysis. For some individuals, results may differ strongly even when changing the algorithm only slightly. Multiverse analysis is a valuable tool for checking the robustness of results from time series models.

- id: cloos-visual-analog-scales
  type: article
  title: "Accuracy and Consistency of Visual Analog Scales in Ecological Momentary Assessment and Digital Studies"
  authors:
    - { family: Cloos, given: Leonie }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Piccirillo, given: Marilyn L. }
    - { family: Fried, given: Eiko }
    - { family: Wang, given: Shirley B. }
    - { family: Helmich, given: Marieke A. }
    - { family: Johnson, given: Sverre Urnes }
    - { family: Hoffart, given: Asle }
    - { family: Ebrahimi, given: Omid V. }
  shared_first: [ 1, 2 ]
  venue: "Collabra: Psychology"
  volume: "11"
