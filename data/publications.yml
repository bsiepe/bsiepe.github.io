  areas: [ bayesian, open-science, metascience ]
  abstract: The field of psychology is in the midst of a methodological revolution. To quantify the changes, we tracked the adoption of Bayesian inference and open science practices across 28,738 articles from six top-tier (15,634 articles) and six mid-tier (13,104 articles) psychology journals over a twenty-year period (2004–2024). For the top-tier journals, human (50%) and LLM-assisted (50%) full-text coding revealed that in 2024, about 1 in every 4 articles (26%) reported a Bayesian analysis, about 2 in every 5 articles (41%) included a preregistration, and about 3 in every 4 articles (73%) provided open data. For the mid-tier journals, LLM full-text coding showed that in 2024, about 1 in every 6 articles (16%) contained a Bayesian analysis, about 1 in every 5 articles (18%) was preregistered, and about 2 in every 5 articles (40%) openly shared data. From 2004 to 2012, these practices were virtually nonexistent. Application of a Bayesian logistic growth model suggests these practices will continue to rise in the future, although the extent of their growth remains uncertain. In addition, our review revealed that mixed-effects models have become more prevalent; software reporting has improved, with growing use of R alongside a relative decline of SPSS; and that estimation-focused reporting showed only modest gains. Despite considerable heterogeneity between journals, our results present a detailed account of the ways in which articles from 2024 differ methodologically from those that were published only a decade before.

- id: hehlmann-affect-dynamics-treatment-outcome
  type: article
  title: "Exploring the predictive value of different affect dynamics for psychological treatment outcome"
  authors:
    - { family: Hehlmann, given: Miriam I. }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Mink, given: Fabienne }
    - { family: Peña Loray, given: Juan Segundo }
    - { family: Gomez Penedo, given: Juan Martín }
    - { family: Fritz, given: Jessica }
    - { family: Moggia, given: Danilo }
    - { family: Rubel, given: Julian A. }
    - { family: Lutz, given: Wolfgang }
  venue: Psychological Assessment
  volume: "37"
  issue: "11"
  pages: "656-669"
  year: 2025
  status: published
  doi: "10.1037/pas0001384"
  preprint_doi: "10.31234/osf.io/3r9q6_v1"
  links:
    code: "https://osf.io/nhy9s"
    data: "https://osf.io/nhy9s"
    prereg: "https://osf.io/nhy9s/files/squn2"
  areas: [ timeseries, esm ]
  abstract: Ecological momentary assessment (EMA) is increasingly used to assess affect dynamics for predicting treatment outcome. While multiple methodological approaches exist, their added predictive value remains unclear, with previous results suggesting a low predictive value beyond mean level (M), standard deviation (SD) or initial impairment (II). To this end, this study aims to evaluate the predictive value of different affect dynamic measures (ADM) for psychological treatment outcome using a naturalistic dataset. 140 white outpatients (63.6% female, 33.6% male) from the psychotherapy clinic of the Trier University reported positive affect and negative affect four times daily over two weeks. We applied continuous-time dynamic modeling (CTDM), drop- and recovery rates, time-varying change point analyses, control charts, and multilevel modeling to each patient’s time series. Interdependencies among indicators were analyzed using principal component analysis. Each ADM's performance for predicting treatment outcome beyond II was assessed via R². The model with the optimal predictor combination (using elastic net regularization) was compared in predictive performance to a model including M and SD of positive and negative affect. Significant interdependencies were found among ADMs. The predictor selection identified the cross-effect of positive affect on negative affect (from the CTDM) as the best predictor, while the model including M and SD of positive and negative affect had the greatest predictive power. In this naturalistic clinical sample, complex ADMs offered limited additional predictive value beyond M or SD for treatment outcome. Considerations and R scripts for each ADM are provided.

- id: kloft-interval-consensus-model
  type: article
  title: "The Interval Consensus Model: Aggregating Continuous Bounded Interval Responses"
  authors:
    - { family: Kloft, given: Matthias }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Heck, given: Daniel W. }
  venue: Psychometrika
  volume: "91"
  issue: "1"
  pages: "199-222"
  year: 2025
  status: published
  doi: "10.1017/psy.2025.10058"
  preprint_doi: "10.31234/osf.io/dzvw2"
  links:
    code: "https://osf.io/r32by/"
    data: "https://osf.io/r32by/"
  areas: [ bayesian, simulation ]
  abstract: Cultural consensus theory (CCT) leverages shared knowledge between individuals to optimally aggregate answers to questions for which the underlying truth is unknown. Existing CCT models have predominantly focused on unidimensional point truths using dichotomous, polytomous, or continuous response formats. However, certain domains, such as risk assessment or interpretation of verbal quantifiers, may require a consensus focused on intervals, capturing a range of relevant values. We introduce the interval consensus model (ICM), a novel extension of CCT designed to estimate consensus intervals from continuous bounded interval responses. We use a Bayesian hierarchical modeling approach to estimate latent consensus intervals. In a simulation study, we show that, under the conditions studied, the ICM performs better than using simple means and medians of the responses. We then apply the model to empirical judgments of verbal quantifiers.

- id: pawel-missingness-simulation-studies
  type: article
  title: "Handling Missingness, Failures, and Non-Convergence in Simulation Studies: A Review of Current Practices and Recommendations"
  authors:
    - { family: Pawel, given: Samuel }
    - { family: Bartoš, given: František }
    - { family: Siepe, given: Björn S., me: true }
    - { family: Lohmann, given: Anna }
  shared_second: [ 2, 3, 4 ]
  venue: The American Statistician
  volume: "80"
  issue: "1"
  pages: "31-48"
  year: 2025
  status: published
  doi: "10.1080/00031305.2025.2540002"
  preprint_doi: "10.48550/arXiv.2409.18527"
  links:
    code: "https://github.com/SamCH93/missSim"
    data: "https://github.com/SamCH93/missSim"
  areas: [ simulation, metascience ]
  abstract: Simulation studies are commonly used in methodological research for the empirical evaluation of data analysis methods. They generate artificial data sets under specified mechanisms and compare the performance of methods across conditions. However, simulation repetitions do not always produce valid outputs, e.g., due to non-convergence or other algorithmic failures. This phenomenon complicates the interpretation of results, especially when its occurrence differs between methods and conditions. Despite the potentially serious consequences of such "missingness", quantitative data on its prevalence and specific guidance on how to deal with it are currently limited. To this end, we reviewed 482 simulation studies published in various methodological journals and systematically assessed the prevalence and handling of missingness. We found that only 23% (111/482) of the reviewed simulation studies mention missingness, with even fewer reporting frequency (92/482 = 19%) or how it was handled (67/482 = 14%). We propose a classification of missingness and possible solutions. We give various recommendations, most notably to always quantify and report missingness, even if none was observed, to align missingness handling with study goals, and to share code and data for reproduction and reanalysis. Using a case study on publication bias adjustment methods, we illustrate common pitfalls and solutions.

- id: siepe-ema-passive-sensors
  type: article
  title: "Associations between ecological momentary assessment and passive sensor data in a large student sample"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Tutunji, given: Rayyan }
    - { family: Rieble, given: Carlotta L. }
    - { family: Proppert, given: Ricarda K. K. }
    - { family: Fried, given: Eiko I. }
  venue: Journal of Psychopathology and Clinical Science
  volume: "134"
  issue: "8"
  pages: "912-925"
  year: 2025
  status: published
  doi: "10.1037/abn0001013"
  preprint_doi: "10.31234/osf.io/ybns6"
  links:
    code: "https://osf.io/txgnq/"
  areas: [ esm ]
  abstract: Ecological momentary assessment (EMA) increases ecological validity but can be burdensome. To reduce this burden and to better understand psychological constructs in daily life, a growing chorus of voices has called for augmenting or replacing EMA data with data passively collected from wearable devices. It is thus critical to investigate the quality of wearable data and its overlap with typical self-report measures. Here we compared results from passive sensing and EMA data from the WARN-D project in a large sample of 781 students. For 3 months, participants wore a Garmin VivoSmart 4 watch and answered EMA surveys (up to 352 measurement points). We investigated whether and to what extent passive sensor metrics were concurrently associated with different self-report measures purportedly measuring the same constructs. We focused on stress, tiredness, and sleep, all of which are relevant to mental health and can arguably be assessed with self-report and physiological measures. We used longitudinal mixed-effects models to estimate average momentary associations and their inter-individual heterogeneity. Self-report and wearable measures of sleep-related variables showed the strongest associations, whereas measures of stress showed a lack of overlap for most individuals. These findings suggest that wearable data and their corresponding self-report measures may not necessarily measure similar constructs. We provide several explanations for this result, including semantic differences and measurement issues, and offer insights and ways forward for research designs combining wearable and self-report data.

