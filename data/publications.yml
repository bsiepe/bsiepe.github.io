  article_number: "142735"
  year: 2025
  status: published
  doi: "10.1525/collabra.142735"
  preprint_doi: "10.31219/osf.io/h2p4w_v1"
  links:
    code: "https://osf.io/utdjq/"
    data: { url: "https://osf.io/utdjq/", note: synthetic data }
  areas: [ esm ]
  abstract: The ubiquity of digital technologies has increased assessments of thoughts, behaviors, and experiences via electronic devices. Surveys on smartphones or laptops often implement Visual Analogue Scales (VAS), recording responses on a continuous slider (0-100). This is particularly relevant for data collection in daily life, such as ecological momentary assessments (EMA), which repeatedly present items on mobile devices. However, the accuracy of digital VAS has been questioned, particularly regarding tactile precision (e.g., ability to accurately select values) and the consistency of scale interpretation both between- and within-persons over time (e.g., change in scale interpretation or reactivity to repeated measures). Participants (N = 3,761, 67.03% female; Mage = 47.09; SD = 14.41) from the Critical Incidents and Psychological Adaptation (CIPA) Study completed a 30-day EMA assessment. We investigated the accuracy of VAS in terms of (1) tactile precision, (2) respondents’ perception of the neutral point post-EMA, and (3) test-retest consistency of affect ratings pre- and post-EMA. (1) Tactile precision was assessed by asking participants to enter exactly 31 on a 0-100 slider. Results showed high precision (M = 31.01; SD = 3.28; 87.0% scored between 30-32). (2) Between-person agreement on scale perception was assessed by asking participants to determine the neutral score on two affect items (unipolar and bipolar). 82.19% and 88.89% indicated the expected scale midpoint (50 and 0, ± 5) as neutral, respectively. Neutral points deviating from the expected midpoint were correlated (r =.71-.73) with the person-specific means across the EMA period on the respective item. (3) Test-retest consistency was evaluated by asking participants to rate how happy/sad they/others would rate affective events (e.g., a serious argument) pre- and post-EMA. Consistency across time was high (median change = 0-5). Findings support the accuracy and consistency of digital VAS, within the scope of the current methods.

- id: siepe-understanding-ema-data
  type: article
  title: "Understanding Ecological-Momentary-Assessment Data: A Tutorial on Exploring Item Performance in Ecological-Momentary-Assessment Data"
  authors:
    - { family: Siepe, given: Björn S., me: true }
    - { family: Rieble, given: Carlotta L. }
    - { family: Tutunji, given: Rayyan }
    - { family: Rimpler, given: Aljoscha }
    - { family: März, given: Julius }
    - { family: Proppert, given: Ricarda K. K. }
    - { family: Fried, given: Eiko I. }
  venue: Advances in Methods and Practices in Psychological Science
  volume: "8"
  issue: "1"
  article_number: "25152459241286877"
  year: 2025
  status: published
  doi: "10.1177/25152459241286877"
  preprint_doi: "10.31234/osf.io/dvj8g"
  links:
    code: "https://osf.io/yf3up/"
    data: { url: "https://osf.io/yf3up/", note: synthetic data }
  areas: [ esm ]
  abstract: The use of ecological-momentary-assessment (EMA) data to study individuals in their everyday lives is popular in many areas of social and life sciences. At the same time, EMA data sets are complex, the psychometric properties of EMA items are often not investigated systematically, and scales are often neither standardized nor validated beyond their face validity. Here, we present different descriptive statistics and data-visualization techniques to increase the understanding of the performance of EMA items. We apply these techniques to a wide range of items used in a large EMA data set (599 participants, 360 time points) collected in the WARN-D study to investigate their distributions, contextual influences, change over time, sources of variability, and relationship with classical static measures of psychopathology. We discuss the theoretical and substantive implications of our findings and provide researchers with R code that they can adapt to their own EMA data, as well as literature recommendations for each topic. We hope to inspire more researchers to share in-depth descriptive summaries of their experience-sampling data such that the field can move forward in understanding the performance of EMA measures across contexts.

- id: freeborn-language-learning-temporal-networks
  type: chapter
  title: "Unravelling the dynamics of language learning: Insights from temporal network analysis"
  authors:
    - { family: Freeborn, given: Lani }
    - { family: Siepe, given: Björn S., me: true }
  editors:
    - { family: Lowie, given: Wander }
    - { family: Rosmawati }
    - { family: De Wilde, given: Vanessa }
  book_title: "Research Methods in CDST Approaches to SLD"
  series: Research Methods in Applied Linguistics
  volume: "14"
  pages: "143-166"
  publisher: John Benjamins Publishing Company
  year: 2025
  status: published
  doi: "10.1075/rmal.14.08fre"
  areas: [ timeseries, networks ]
  abstract: "In this chapter, we use temporal network analysis to model longitudinal associations among six variables. We present three different networks to illustrate the threefold framework that temporal network analysis offers for analysing time-series data ( Blanchard et al., 2023 ): a temporal network (how variables predict one another from one timepoint to the next), a contemporaneous network (how variables are related within the same timeframe), and a between-subjects network (how variables are related across individuals). Conceptually, a network approach has many affordances for CDST-inspired research. Temporal network analysis is an exploratory, data-driven method that is conceptually aligned with many aspects of CDST. Methodologically however, temporal network analysis presents several challenges, including the large number of data points needed, assumptions of linearity, and considerations for handling missing data."

